name: Deploy to Korea VPS

on:
  push:
    branches:
      - gh-pages

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-korea
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy website to Korea VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -p ${VPS_PORT} -o StrictHostKeyChecking=yes" \
            ./ \
            "${VPS_USER}@${VPS_HOST}:/var/www/demo/"

      - name: Deployment completed
        run: |
          echo "Website deployed to Korea VPS"
